services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaerngschee-backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - PHP_DISPLAY_ERRORS=1
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=gaerngschee
      - DB_USER=gaerngschee
      - DB_PASSWORD=changeme

  database:
    image: mariadb:10.11
    container_name: gaerngschee-database
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=gaerngschee
      - MYSQL_USER=gaerngschee
      - MYSQL_PASSWORD=changeme
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: